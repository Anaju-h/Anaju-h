<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" shape-rendering="crispEdges" role="img" aria-label="Quote from Alice in Wonderland"><title>Quote from Alice in Wonderland</title><rect x="0" y="0" width="680" height="150" fill="#a8772a"/><rect x="5" y="5" width="670" height="140" fill="#4a2c1a"/><rect x="11" y="11" width="658" height="128" fill="#3a2214"/><rect x="16" y="24" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="38" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="52" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="66" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="80" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="94" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="108" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="122" width="648" height="1" fill="#ffffff0d"/><rect x="20" y="20" width="10" height="10" fill="#ffd877"/><rect x="650" y="20" width="10" height="10" fill="#ffd877"/><rect x="20" y="120" width="10" height="10" fill="#ffd877"/><rect x="650" y="120" width="10" height="10" fill="#ffd877"/><text x="50" y="56" fill="#f3e2bd" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="bold" shape-rendering="auto">“Begin at the beginning,” the King said, very gravely,</text><text x="50" y="82" fill="#f3e2bd" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="bold" shape-rendering="auto">“and go on till you come to the end: then stop.”</text><text x="628" y="112" fill="#e0b04a" font-family="'Courier New',Courier,monospace" font-size="16" text-anchor="end">The King of Hearts</text><text x="628" y="128" fill="#8f5a34" font-family="'Courier New',Courier,monospace" font-size="12" text-anchor="end">Alice's Adventures in Wonderland, Lewis Carroll (1865)</text></svg>
