<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" shape-rendering="crispEdges" role="img" aria-label="Quote from Hamlet"><title>Quote from Hamlet</title><rect x="0" y="0" width="680" height="150" fill="#a8772a"/><rect x="5" y="5" width="670" height="140" fill="#4a2c1a"/><rect x="11" y="11" width="658" height="128" fill="#3a2214"/><rect x="16" y="24" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="38" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="52" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="66" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="80" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="94" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="108" width="648" height="1" fill="#ffffff0d"/><rect x="16" y="122" width="648" height="1" fill="#ffffff0d"/><rect x="20" y="20" width="10" height="10" fill="#ffd877"/><rect x="650" y="20" width="10" height="10" fill="#ffd877"/><rect x="20" y="120" width="10" height="10" fill="#ffd877"/><rect x="650" y="120" width="10" height="10" fill="#ffd877"/><text x="340.0" y="70" fill="#f3e2bd" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="bold" text-anchor="middle" shape-rendering="auto">“We know what we are, but know not what we may be.”</text><text x="628" y="108" fill="#e0b04a" font-family="'Courier New',Courier,monospace" font-size="16" text-anchor="end">Ophelia</text><text x="628" y="126" fill="#8f5a34" font-family="'Courier New',Courier,monospace" font-size="12" text-anchor="end">Hamlet, William Shakespeare (c. 1600)</text></svg>
